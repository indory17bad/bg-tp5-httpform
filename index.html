<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CinéPass - club inscriptions </title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <header class="header">
			<h1>🎬 CinéPass</h1>
			<p>Inscription au Club de Cinéma - Saison 2025</p>
		</header>
        <form>
            <div class="tip">
				💡 Rejoignez notre club et profitez de tarifs réduits, d'avant-premières exclusives et de rencontres avec des réalisateurs !
			</div>

            <section>
                <h2>👤 Informations personnelles</h2>

				<div class="form-row">
					<div class="form-group">
						<label for="prenom">Last name :</label>
						<input type="text" id="prenom" name="prenom" placeholder="Ex: Mira" required>
					</div>
					<div class="form-group">
						<label for="nom">First name :</label>
						<input type="text" id="nom" name="nom" placeholder="Ex: Roze" required>
					</div>
				</div>

                <div class="form-group">
					<label for="email">Adresse email :</label>
					<input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required>
				</div>

				<div class="form-group">
					<label for="password">Mot de passe (compte en ligne) :</label>
					<input type="password" id="password" name="password" placeholder="Minimum 8 caractères" minlength="8" autocomplete="new-password" required>
				</div>

				<div class="form-row">
					<div class="form-group">
						<label for="telephone">Téléphone :</label>
						<input type="tel" id="telephone" name="telephone" placeholder="0555123456">
					</div>
					<div class="form-group">
						<label for="naissance">Date de naissance :</label>
						<input type="date" id="naissance" name="naissance">
					</div>
				</div>
            </section>

            <section>
                <h2>🎫 Formule d'abonnement</h2>

				<fieldset>
					<legend>Choisissez votre formule :</legend>
					<label class="option">
						<input type="radio" name="formule" value="basique" checked>
						<span>🥉 Basique - 4 séances/mois (2000 DA/mois)</span>
					</label>
					<label class="option">
						<input type="radio" name="formule" value="premium">
						<span>🥈 Premium - 10 séances/mois (4500 DA/mois)</span>
					</label>
					<label class="option">
						<input type="radio" name="formule" value="illimite">
						<span>🥇 Illimité - Séances illimitées (7000 DA/mois)</span>
					</label>
				</fieldset>

            </section>

        </form>
    </div>
</body>
</html>
