<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CinéPass - club inscriptions </title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <header class="header">
			<h1>🎬 CinéPass</h1>
			<p>Inscription au Club de Cinéma - Saison 2025</p>
		</header>
        <form>
            <div class="tip">
				💡 Rejoignez notre club et profitez de tarifs réduits, d'avant-premières exclusives et de rencontres avec des réalisateurs !
			</div>

            <section>
                <h2>👤 Informations personnelles</h2>

				<div class="form-row">
					<div class="form-group">
						<label for="prenom">Last name :</label>
						<input type="text" id="prenom" name="prenom" placeholder="Ex: Mira" required>
					</div>
					<div class="form-group">
						<label for="nom">First name :</label>
						<input type="text" id="nom" name="nom" placeholder="Ex: Roze" required>
					</div>
				</div>

            </section>

        </form>
    </div>
</body>
</html>
